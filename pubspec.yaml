name: kalpana
description: Kalpana - voice-first assistant for visually impaired users.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  lucide_icons: ^0.257.0
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  url_launcher: ^6.3.0
  camera: ^0.11.0
  flutter_contacts: ^1.1.9+2
  http: ^1.2.0
  google_mlkit_text_recognition: any
  google_mlkit_image_labeling: any
  shared_preferences: ^2.3.0
  flutter_phone_direct_caller: ^2.1.1
  flutter_litert: ^0.1.16

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/icon.png
    - assets/models/yolo26n.tflite

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/images/icon.png
